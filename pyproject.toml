[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eve"
dynamic = ["version"]
description = "eve - a personal toolbox of commands worth keeping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "rich-click>=1.8",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff>=0.16,<0.17"]

[project.scripts]
eve = "eve.__main__:main"

[tool.setuptools_scm]
# Derived from git tags: a tagged commit gets that version, anything after it
# gets the next patch as a .devN with the short sha appended. Installing from a
# tarball or a history-less checkout has no git to read, hence the fallback.
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
include = ["eve*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["eve"]
